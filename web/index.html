<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI Incident Commander</title>
<style>
:root{--bg:#0f1220;--card:#181c2f;--tx:#e8eaf2;--mut:#8a90a8;--p1:#ff4d5e;--p2:#ffa62b;--p3:#4da3ff;--p4:#7a8199}
*{box-sizing:border-box}body{margin:0;font:14px system-ui,sans-serif;background:var(--bg);color:var(--tx)}
header{padding:14px 16px;background:#13162a;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
h1{font-size:18px;margin:0}nav button{background:none;border:0;color:var(--mut);padding:8px 10px;cursor:pointer;font-size:14px}
nav button.on{color:#fff;border-bottom:2px solid var(--p2)}main{padding:16px;max-width:1300px;margin:auto}
.card{background:var(--card);border-radius:10px;padding:14px;margin-bottom:14px}.row{display:flex;gap:14px;flex-wrap:wrap}.row>*{flex:1;min-width:280px}
.b{display:inline-block;padding:2px 8px;border-radius:6px;font-weight:700;font-size:12px;color:#000}.P1{background:var(--p1)}.P2{background:var(--p2)}.P3{background:var(--p3)}.P4{background:var(--p4)}
.inc{border-left:4px solid;padding:10px 12px;margin:8px 0;background:#1e2340;border-radius:6px}.inc small{color:var(--mut)}
#feed{height:340px;overflow:auto;font:12px ui-monospace,monospace;background:#0b0d18;padding:8px;border-radius:8px}
.ERROR{color:#ff7a85}.WARN{color:#ffc46b}.DEBUG{color:#666}.INFO{color:#b8bdd0}
.kpi{font-size:28px;font-weight:800}.mut{color:var(--mut)}button.act{background:var(--p2);border:0;border-radius:6px;padding:8px 14px;font-weight:700;cursor:pointer}
table{width:100%;border-collapse:collapse}td,th{padding:6px;border-bottom:1px solid #2a2f4a;text-align:left;vertical-align:top}
.bar{display:flex;align-items:flex-end;gap:3px;height:140px}.bar div{flex:1;display:flex;flex-direction:column-reverse}.bar span{display:block}
pre{white-space:pre-wrap}.toast{position:fixed;right:16px;bottom:16px;max-width:380px;z-index:9}
</style></head><body>
<header><h1>🏥 AI Incident Commander <span class="mut" style="font-size:13px">· Hospital ops · 2026-11-25</span></h1>
<nav id="nav"></nav></header><main id="app"></main><div class="toast" id="toast"></div>
<script src="data.js"></script>
<script>
const D=window.DATA,$=s=>document.querySelector(s),O={P1:1,P2:2,P3:3,P4:4};
const tabs={live:"Live command",incidents:"Incidents by urgency",messages:"Messages sent",history:"History (day/week)",validate:"Validate logs",report:"End-of-day report"};
let tab="live";
function nav(){$("#nav").innerHTML=Object.entries(tabs).map(([k,v])=>`<button class="${k==tab?'on':''}" onclick="go('${k}')">${v}</button>`).join("")}
function go(t){tab=t;nav();R[t]()}
const incHTML=i=>`<div class="inc" style="border-color:var(--${i.level.toLowerCase()})"><span class="b ${i.level}">${i.level}</span> <b>${i.id} · ${i.title}</b><br>
<small>${i.service} @ ${i.hosts.join(", ")} · opened ${i.opened.slice(11,16)} · ${i.status}${i.resolved?" "+i.resolved.slice(11,16):""}</small>
<p>${i.why}</p><p><b>Action:</b> ${i.action}</p><small>Notify: ${(D.response[i.level].who).join(", ")} via ${D.response[i.level].how.join(", ")} · SLA: ${D.response[i.level].sla}</small></div>`;
let timer=null;
const R={
live(){$("#app").innerHTML=`<div class="card"><button class="act" id="play">▶ Replay the day live</button> speed <select id="sp"><option value="60">×60</option><option value="600" selected>×600</option><option value="3000">×3000</option></select>
<span class="mut"> Log lines arrive one by one; the agent raises each alert once, at the moment it should.</span> <b id="clk"></b></div>
<div class="row"><div class="card"><h3>Incoming log stream</h3><div id="feed"></div></div><div class="card"><h3>Open incidents (sorted by urgency)</h3><div id="open" class="mut">Press replay…</div></div></div>`;
$("#play").onclick=()=>{clearInterval(timer);let i=0,f=$("#feed"),t0=new Date(D.lines[0][0]),sim=+t0,ai=0,shown={};f.innerHTML="";
 const sp=+$("#sp").value;timer=setInterval(()=>{sim+=100*sp;let buf="";
 while(i<D.lines.length&&new Date(D.lines[i][0])<=sim){const l=D.lines[i];buf+=`<div class="${l[1]}">${l[0].slice(11,19)} ${l[1].padEnd(5)} ${l[2]} ${l[4]} ${l[5]}</div>`;i++}
 if(buf){f.insertAdjacentHTML("beforeend",buf);while(f.children.length>300)f.firstChild.remove();f.scrollTop=1e9}
 while(ai<D.alerts.length&&new Date(D.alerts[ai].emitted_at)<=sim){const a=D.alerts[ai++];shown[a.alert_id]=a;toast(a)}
 $("#clk").textContent=new Date(sim).toISOString().slice(11,19)+" UTC";
 const list=Object.values(shown).sort((a,b)=>(a.status=="resolved")-(b.status=="resolved")||O[a.level]-O[b.level]);
 $("#open").innerHTML=list.map(a=>`<div class="inc" style="border-color:var(--${a.level.toLowerCase()});opacity:${a.status=="resolved"?.5:1}"><span class="b ${a.level}">${a.level}</span> <b>${a.title}</b><br><small>${a.emitted_at.slice(11,16)} · ${a.status} · ${a.service}</small><br>${a.explanation}</div>`).join("")||"No incidents yet.";
 if(i>=D.lines.length)clearInterval(timer)},100)}},
incidents(){const s=[...D.incidents].sort((a,b)=>O[a.level]-O[b.level]||a.opened.localeCompare(b.opened));
 $("#app").innerHTML=`<div class="row">${["P1","P2","P3"].map(l=>`<div class="card"><span class="b ${l}">${l}</span><div class="kpi">${s.filter(i=>i.level==l).length}</div><span class="mut">${D.response[l].sla}</span></div>`).join("")}</div><div class="card">${s.map(incHTML).join("")}</div>
 <div class="card"><h3>Suppressed noise (looked scary, no action)</h3>${Object.entries(D.noise).map(([k,v])=>`<div>${v} × ${k}</div>`).join("")}</div>`},
messages(){$("#app").innerHTML=`<div class="card"><h3>Messages emitted by the agent (${D.alerts.length}) — one per problem, plus escalation/resolution updates</h3><table><tr><th>Time</th><th>Level</th><th>To / channel</th><th>Message</th></tr>${D.alerts.map(a=>`<tr><td>${a.emitted_at.slice(11,19)}</td><td><span class="b ${a.level}">${a.level}</span> ${a.status}</td><td>${a.notify.join(", ")}<br><small class="mut">${a.channels.join(" · ")}</small></td><td><b>${a.title}</b><br>${a.explanation}<br><i>Action: ${a.action}</i><br><small class="mut">Evidence: log line ${a.evidence_line}</small></td></tr>`).join("")}</table></div>`},
history(){const H=D.hourly,mx=Math.max(...Object.values(H).map(v=>Object.values(v).reduce((a,b)=>a+b,0)));
 const days=[...Array(7)].map((_,k)=>{const d=new Date("2026-11-25");d.setDate(d.getDate()-6+k);return d.toISOString().slice(0,10)});
 $("#app").innerHTML=`<div class="card"><h3>Day view — log volume per hour (errors red, warnings orange) and incidents</h3><div class="bar">${[...Array(24)].map((_,h)=>{const v=H[h]||{};return `<div title="${h}h">${["INFO","DEBUG","WARN","ERROR"].map(k=>`<span style="height:${(v[k]||0)/mx*130}px;background:${{INFO:'#3b4266',DEBUG:'#2a2f4a',WARN:'var(--p2)',ERROR:'var(--p1)'}[k]}"></span>`).join("")}</div>`}).join("")}</div>
 <div class="mut" style="display:flex;justify-content:space-between"><span>00h</span><span>12h</span><span>23h</span></div>
 <table>${[...D.incidents].sort((a,b)=>a.opened.localeCompare(b.opened)).map(i=>`<tr><td>${i.opened.slice(11,16)}</td><td><span class="b ${i.level}">${i.level}</span></td><td>${i.title}</td><td>${i.status}</td></tr>`).join("")}</table></div>
 <div class="card"><h3>Week view</h3><table><tr><th>Day</th><th>P1</th><th>P2</th><th>P3</th><th>Lines</th></tr>${days.map(d=>d==D.date?`<tr><td>${d}</td>${["P1","P2","P3"].map(l=>`<td>${D.incidents.filter(i=>i.level==l).length}</td>`).join("")}<td>${D.lines.length}</td></tr>`:`<tr class="mut"><td>${d}</td><td colspan=4>Not found — no log was provided for this day (nothing invented).</td></tr>`).join("")}</table></div>`},
validate(){$("#app").innerHTML=`<div class="card"><h3>Validate a log file</h3><p class="mut">Checks every line is JSON with timestamp/level/service/message, in order. Empty, invalid or huge files get a clear message without blocking.</p>
 <input type="file" id="fi"> <div id="vr"></div><h4>Today's file (hospital.log)</h4><p>${D.lines.length} lines · ${D.invalid.length} invalid · levels: ${Object.entries(D.stats).map(([k,v])=>k+" "+v).join(", ")}</p></div>`;
 $("#fi").onchange=e=>{const f=e.target.files[0];if(!f)return;if(f.size==0)return $("#vr").innerHTML="<p style='color:var(--p1)'>File is empty — nothing to validate.</p>";if(f.size>200e6)return $("#vr").innerHTML="<p style='color:var(--p2)'>File larger than 200 MB — use the CLI agent (streams line by line).</p>";
 f.text().then(t=>{const L=t.split(/\n/).filter(x=>x.trim());let bad=[],miss=0,order=0,prev="";L.forEach((l,n)=>{try{const r=JSON.parse(l);if(!r.timestamp||!r.level||!r.service||!r.message)miss++;if(r.timestamp<prev)order++;prev=r.timestamp||prev}catch(e){bad.push(n+1)}});
 $("#vr").innerHTML=`<p>${L.length} lines · <b style="color:${bad.length?'var(--p1)':'#5f5'}">${bad.length} invalid JSON</b>${bad.length?" (lines "+bad.slice(0,10).join(", ")+")":""} · ${miss} missing fields · ${order} out of order</p>`})}},
report(){$("#app").innerHTML=`<div class="card"><pre>${D.report.replace(/</g,"&lt;")}</pre></div>`}};
function toast(a){if(a.level>"P2")return;const t=$("#toast");t.innerHTML=`<div class="inc" style="border-color:var(--${a.level.toLowerCase()});box-shadow:0 4px 20px #000"><span class="b ${a.level}">${a.level}</span> <b>${a.status.toUpperCase()}</b> ${a.title}<br><small>${a.notify.join(", ")}</small></div>`;setTimeout(()=>t.innerHTML="",3500)}
nav();R.live();
</script></body></html>
